<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>داشبۆردی شارەوانی · GreenLegacy Slemani</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@600;800&family=Noto+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/leaflet/leaflet.css">
<style>
  :root {
    --forest: #0F2A1F; --paper: #F5F2EA; --paper-2: #ECE7DA; --card: #FFFDF8;
    --line: #E2DDD0; --ink: #13261D; --soft: #4A5A51; --green: #1E7A4A;
    --amber: #B5651D; --red: #9E2A2B;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
         font-family: 'Noto Sans Arabic', Tahoma, sans-serif; font-size: 15px; }
  h1, h2, h3, .num { font-family: 'Noto Kufi Arabic', 'Noto Sans Arabic', Tahoma, sans-serif; }
  header { background: var(--forest); color: #F2EFE6; padding: 18px 24px; display: flex;
           align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 20px; }
  header small { color: #BFD3C6; }
  button { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line);
           background: var(--card); padding: 8px 14px; color: var(--ink); }
  button.primary { background: var(--green); color: #fff; border-color: var(--green); }
  button.danger { color: var(--red); border-color: #E8C9C9; }
  main { max-width: 1280px; margin: 0 auto; padding: 20px 16px 40px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .stat .num { font-size: 30px; font-weight: 800; }
  .stat .label { color: var(--soft); }
  .tabs { display: flex; gap: 8px; margin: 20px 0 12px; flex-wrap: wrap; }
  .tabs button[aria-selected="true"] { background: var(--forest); color: #fff; border-color: var(--forest); }
  .badge { background: var(--amber); color: #fff; border-radius: 999px; padding: 0 8px; margin-inline-start: 6px; font-size: 12px; }
  .panel { display: none; } .panel.active { display: block; }
  #map { height: 560px; border-radius: 14px; border: 1px solid var(--line); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; color: var(--soft); }
  .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: middle; margin-inline-end: 6px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 14px; overflow: hidden; }
  th, td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: right; vertical-align: middle; white-space: nowrap; }
  th { background: var(--paper-2); font-weight: 600; }
  td img { width: 72px; height: 54px; object-fit: cover; border-radius: 8px; }
  .level { display: inline-block; min-width: 34px; text-align: center; border-radius: 8px; padding: 2px 8px; color: #fff; font-weight: 600; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
  .pair figure { margin: 0; }
  .pair img { width: 100%; height: 150px; object-fit: cover; border-radius: 10px; background: var(--paper-2); }
  .pair figcaption { color: var(--soft); font-size: 13px; }
  .verdict { border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 600; }
  .verdict.verified { background: #E3F2E9; color: var(--green); }
  .verdict.review { background: #FBEFD9; color: var(--amber); }
  .verdict.rejected { background: #F6E1E1; color: var(--red); }
  .muted { color: var(--soft); }
  .empty { padding: 30px; text-align: center; color: var(--soft); background: var(--card); border-radius: 14px; border: 1px dashed var(--line); }
  #login { position: fixed; inset: 0; background: rgba(15, 42, 31, .85); display: flex;
           align-items: center; justify-content: center; padding: 16px; z-index: 2000; }
  #login[hidden] { display: none; }
  #login form { background: var(--card); padding: 24px; border-radius: 16px; width: 100%; max-width: 360px; display: grid; gap: 10px; }
  #login input { font: inherit; padding: 10px; border-radius: 10px; border: 1px solid var(--line); direction: ltr; text-align: right; }
  #login .error { color: var(--red); min-height: 1.4em; }
  .actions { display: flex; gap: 8px; margin-top: 8px; }
  .desc { white-space: normal; min-width: 220px; max-width: 360px; color: var(--soft); font-size: 13px; }
  .trust { font-size: 12px; border-radius: 999px; padding: 1px 8px; background: var(--paper-2); color: var(--soft); }
  .trust.low { background: #F6E1E1; color: var(--red); }
  .voucher { font-family: ui-monospace, Menlo, Consolas, monospace; direction: ltr; display: inline-block; }
  .swatch { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: middle;
            border: 1.5px solid #184F95; margin-inline-end: 4px; }
  .swatch.none { background: transparent; border-style: dashed; }
  #area-legend { display: inline-flex; align-items: center; gap: 4px 16px; flex-wrap: wrap; }
  #area-legend[hidden] { display: none; }
  #area-legend .step { white-space: nowrap; }
  #map .leaflet-interactive:focus:not(:focus-visible) { outline: none; }   /* no box around a clicked area */
  .figures { background: none; border-radius: 0; margin-top: 4px; width: auto; }
  .figures td { padding: 1px 0; border: 0; font-size: 13px; }
  .figures td:last-child { padding-inline-start: 14px; font-weight: 600; }
  .pts-cell { min-width: 130px; }
  @media (max-width: 860px) { .pts-cell { min-width: 80px; } }
  .league { display: grid; grid-template-columns: minmax(0, 2fr) minmax(260px, 1fr); gap: 16px; align-items: start; }
  .league h2 { font-size: 16px; margin: 0 0 10px; }
  @media (max-width: 860px) { .league { grid-template-columns: minmax(0, 1fr); } }
  .bar { height: 5px; border-radius: 999px; background: var(--green); margin-top: 4px; }
  .rank { display: inline-flex; align-items: center; justify-content: center; min-width: 28px; height: 28px;
          border-radius: 50%; background: var(--paper-2); font-weight: 600; }
  .rank.first { background: var(--forest); color: #fff; }
  .people { list-style: none; margin: 0; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
  .people li { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .people li:last-child { border-bottom: 0; }
  .people .who { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .people .who small { color: var(--soft); margin-inline-start: 6px; }
  .people .pts { font-weight: 800; white-space: nowrap; }
  .note { color: var(--soft); font-size: 13px; margin: 8px 0 0; }
</style>
</head>
<body>
<div id="login" hidden>
  <form id="login-form">
    <h2 style="margin:0">چوونەژوورەوەی شارەوانی</h2>
    <input id="phone" placeholder="ژمارەی مۆبایل" autocomplete="username" required>
    <input id="password" type="password" placeholder="وشەی نهێنی" autocomplete="current-password" required>
    <div class="error" id="login-error"></div>
    <button class="primary" type="submit">چوونەژوورەوە</button>
  </form>
</div>

<header>
  <div>
    <h1>داشبۆردی شارەوانی</h1>
    <small>GreenLegacy Slemani · هەر ١٠ چرکە جارێک نوێ دەبێتەوە</small>
  </div>
  <button id="logout">چوونەدەرەوە</button>
</header>

<main>
  <section class="stats" id="stats"></section>

  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="map">نەخشەی زیندوو</button>
    <button role="tab" aria-selected="false" data-tab="priority">لیستی ئەولەویەت</button>
    <button role="tab" aria-selected="false" data-tab="log">تۆماری پاککردنەوە</button>
    <button role="tab" aria-selected="false" data-tab="review">پشکنین<span class="badge" id="review-count">٠</span></button>
    <button role="tab" aria-selected="false" data-tab="vouchers">خەڵاتەکان</button>
    <button role="tab" aria-selected="false" data-tab="league">لیگ</button>
  </nav>

  <section class="panel active" id="panel-map">
    <div id="map"></div>
    <div class="legend" id="legend"></div>
  </section>
  <section class="panel" id="panel-priority"><div id="priority"></div></section>
  <section class="panel" id="panel-log"><div id="log"></div></section>
  <section class="panel" id="panel-review"><div id="review"></div></section>
  <section class="panel" id="panel-vouchers"><div id="vouchers"></div></section>
  <section class="panel" id="panel-league">
    <div class="league">
      <div><h2>لیگی گەڕەکەکان</h2><div id="league-hoods"></div></div>
      <div><h2>باشترین هاوڵاتییان</h2><div id="league-people"></div></div>
    </div>
  </section>
</main>

<script src="/static/leaflet/leaflet.js"></script>
<script>
const LEVEL_COLOURS = ['#E9C46A', '#E0A030', '#D9822B', '#C4532F', '#9E2A2B'];
const STATUS = { open: 'کراوە', in_progress: 'لە پاککردنەوەدایە', needs_review: 'چاوەڕوانی پشکنین', clean: 'پاککراوە' };
const VERDICT = { verified: 'سەلمێنرا', review: 'پشکنین', rejected: 'ڕەتکرایەوە' };
const toKu = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const signed = n => (n > 0 ? '+' : n < 0 ? '−' : '') + toKu(Math.abs(n || 0));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let token = null;
try { token = localStorage.getItem('gl_staff_token'); } catch (e) { /* storage blocked */ }

function showLogin() { document.getElementById('login').hidden = false; }

async function api(path, options = {}) {
  const res = await fetch(path, { ...options, headers: { 'Content-Type': 'application/json',
    ...(token ? { Authorization: 'Bearer ' + token } : {}) } });
  if (res.status === 401 || res.status === 403) { showLogin(); throw new Error('auth'); }
  return res.json();
}

document.getElementById('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const res = await fetch('/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ phone: document.getElementById('phone').value.trim(),
                           password: document.getElementById('password').value }) });
  const data = await res.json();
  if (!res.ok || data.user.role !== 'staff') {
    document.getElementById('login-error').textContent = data.message || 'ئەم هەژمارە هی شارەوانی نییە';
    return;
  }
  token = data.token;
  try { localStorage.setItem('gl_staff_token', token); } catch (e) { /* storage blocked */ }
  document.getElementById('login').hidden = true;
  refresh();
});

document.getElementById('logout').addEventListener('click', () => {
  token = null;
  try { localStorage.removeItem('gl_staff_token'); } catch (e) { /* storage blocked */ }
  showLogin();
});

document.querySelectorAll('[data-tab]').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-selected', String(b === btn)));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + btn.dataset.tab));
  if (btn.dataset.tab === 'map') setTimeout(() => map.invalidateSize(), 50);
}));

// ---- live map: open spots coloured by dirtiness, clean spots green
const map = L.map('map').setView([35.5613, 45.4373], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);
const areaLayer = L.featureGroup().addTo(map);   // neighbourhood boundaries, kept under the spots
const layer = L.layerGroup().addTo(map);
let fitted = false;
let lastSpots = [];

// Areas: one blue hue, light to dark, by open spots. Blue keeps them apart from the yellow-red spot
// markers on top; fixed steps (not "share of the busiest area") so a colour means the same count every refresh.
const AREA_COLOURS = ['#B7D3F6', '#86B6EF', '#5598E7', '#2A78D6', '#1C5CAB'];
const AREA_STEPS = [1, 2, 4, 7, 11];            // the open-spot count where each colour starts
const areaColour = open => AREA_COLOURS[AREA_STEPS.filter(s => open >= s).length - 1];
const stepLabel = i => i === AREA_STEPS.length - 1 ? toKu(AREA_STEPS[i]) + '+'
  : AREA_STEPS[i + 1] - 1 === AREA_STEPS[i] ? toKu(AREA_STEPS[i]) : `${toKu(AREA_STEPS[i])}–${toKu(AREA_STEPS[i + 1] - 1)}`;
const decimal = n => toKu(n).replace('.', '٫');

document.getElementById('legend').innerHTML =
  LEVEL_COLOURS.map((c, i) => `<span><span class="dot" style="background:${c}"></span>پیسی ${toKu(i + 1)}</span>`).join('') +
  '<span><span class="dot" style="background:#1E7A4A"></span>پاککراوە</span>' +
  `<span id="area-legend" hidden>گەڕەک بەپێی شوێنی کراوە:
     <span class="step"><span class="swatch none"></span>${toKu(0)}</span>` +
  AREA_COLOURS.map((c, i) => `<span class="step"><span class="swatch" style="background:${c}"></span>${stepLabel(i)}</span>`).join('') +
  '</span>';

const levelPill = level => `<span class="level" style="background:${LEVEL_COLOURS[level - 1]}">${toKu(level)}</span>`;

const areaStyle = h => h.open > 0
  ? { color: '#184F95', weight: 1.5, opacity: .9, fillColor: areaColour(h.open), fillOpacity: .45, dashArray: null }
  : { color: '#184F95', weight: 1.5, opacity: .9, fillColor: '#184F95', fillOpacity: 0, dashArray: '5 5' };

// one figure per line: a "·" separator next to the Kurdish zero "٠" reads as two zeros
const areaPopup = h => `<div dir="rtl"><strong>${esc(h.name)}</strong>
  <table class="figures"><tr><td>خاڵ</td><td>${toKu(h.points)}</td></tr>
    <tr><td>هاوڵاتی</td><td>${toKu(h.citizens)}</td></tr>
    <tr><td>شوێنی کراوە</td><td>${toKu(h.open)}</td></tr>
    <tr><td>پاککراوە</td><td>${toKu(h.cleaned)}</td></tr>${h.avg_dirtiness == null ? ''
      : `<tr><td title="تێکڕای پلەی پیسیی شوێنە کراوەکان">تێکڕای پیسی</td><td>${decimal(h.avg_dirtiness)}</td></tr>`}</table></div>`;

// id -> {key, layer}. A boundary is rebuilt only when its shape changes, so an open popup survives the refresh.
const areas = new Map();

function drawAreas(hoods) {
  const keep = new Set();
  for (const h of hoods) {
    if (!h.boundary) continue;
    const key = JSON.stringify(h.boundary);
    let area = areas.get(h.id);
    if (!area || area.key !== key) {
      if (area) areaLayer.removeLayer(area.layer);
      area = { key, layer: L.geoJSON(h.boundary).bindPopup('').bindTooltip('', { sticky: true }) };
      areas.set(h.id, area);
      areaLayer.addLayer(area.layer);
    }
    area.layer.setStyle(areaStyle(h)).setPopupContent(areaPopup(h)).setTooltipContent(esc(h.name));
    area.layer.bringToBack();                  // spot markers stay on top and clickable
    keep.add(h.id);
  }
  for (const [id, area] of areas) {
    if (!keep.has(id)) { areaLayer.removeLayer(area.layer); areas.delete(id); }
  }
  document.getElementById('area-legend').hidden = !areas.size;
}

// first load only: zoom to the spots, or to the neighbourhoods while there are no spots yet
function fitOnce() {
  if (fitted) return;
  if (lastSpots.length) map.fitBounds(lastSpots.map(s => [s.lat, s.lon]), { maxZoom: 16, padding: [40, 40] });
  else if (areas.size) map.fitBounds(areaLayer.getBounds(), { padding: [20, 20] });
  else return;
  fitted = true;
}

async function loadMap() {
  const spots = await api('/reports');
  lastSpots = spots;
  layer.clearLayers();
  for (const s of spots) {
    const clean = s.status === 'clean';
    L.circleMarker([s.lat, s.lon], {
      radius: clean ? 7 : 6 + s.dirtiness * 2, weight: 2, color: '#fff',
      fillColor: clean ? '#1E7A4A' : LEVEL_COLOURS[s.dirtiness - 1], fillOpacity: .9,
    }).bindPopup(`<div dir="rtl"><img src="${esc(s.photo_url)}" style="width:180px;border-radius:8px"><br>
      پلەی پیسی: ${toKu(s.dirtiness)} · پاشماوە: ${toKu(s.litter_count)}<br>${STATUS[s.status] || esc(s.status)}
      ${s.description ? `<p style="max-width:220px;margin:6px 0 0">${esc(s.description)}</p>` : ''}</div>`)
      .addTo(layer);
  }
}

// ---- priority list: dirtiest and oldest first
async function loadPriority() {
  const rows = await api('/admin/reports');
  const box = document.getElementById('priority');
  if (!rows.length) { box.innerHTML = '<div class="empty">هیچ شوێنێکی کراوە نییە</div>'; return; }
  box.innerHTML = `<div class="table-wrap"><table><thead><tr><th>ڕیز</th><th>وێنە</th><th>پیسی</th><th>پاشماوە</th>
    <th>تەمەن</th><th>پشتڕاستکردنەوە</th><th>دۆخ</th><th>وەسف</th></tr></thead><tbody>` +
    rows.map((r, i) => `<tr><td>${toKu(i + 1)}</td><td><img src="${esc(r.photo_url)}" alt=""></td>
      <td>${levelPill(r.dirtiness)}</td><td>${toKu(r.litter_count)}</td>
      <td>${toKu(Math.round(r.age_hours))} کاتژمێر</td><td>${toKu(r.confirmations)}</td>
      <td>${STATUS[r.status] || esc(r.status)}</td><td class="desc">${esc(r.description)}</td></tr>`).join('') +
    '</tbody></table></div>';
}

// ---- cleanup log and review queue: before and after side by side
function cleanupCard(c, withActions) {
  const when = new Date(c.created_at).toLocaleString('en-GB');
  const after = c.litter_count_after == null ? '—' : toKu(c.litter_count_after);
  return `<article class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <strong>شوێنی ${toKu(c.report_id)} · ${esc(c.cleaner)}
        <span class="trust ${c.cleaner_trust < 0 ? 'low' : ''}" title="متمانەی پاککەرەوە">متمانە ${signed(c.cleaner_trust)}</span></strong>
      <span class="verdict ${esc(c.verdict)}">${VERDICT[c.verdict] || esc(c.verdict)}</span></div>
    <div class="pair">
      <figure><img src="${esc(c.before_url)}" alt="پێش"><figcaption>پێش · ${toKu(c.litter_count_before ?? 0)} پاشماوە</figcaption></figure>
      <figure><img src="${esc(c.after_url || '')}" alt="دوا"><figcaption>دوا · ${after} پاشماوە</figcaption></figure>
    </div>
    <div class="muted">${esc(c.reason)}</div>
    <div class="muted" style="direction:ltr;text-align:right;font-size:12px">${esc(when)}</div>
    ${withActions ? `<div class="actions"><button class="primary" data-review="${c.id}" data-decision="approve">پەسەندکردن</button>
       <button class="danger" data-review="${c.id}" data-decision="reject">ڕەتکردنەوە</button></div>` : ''}
  </article>`;
}

async function loadLog() {
  const rows = await api('/admin/cleanups');
  document.getElementById('log').innerHTML = rows.length
    ? `<div class="cards">${rows.map(c => cleanupCard(c, false)).join('')}</div>`
    : '<div class="empty">هێشتا هیچ پاککردنەوەیەک نییە</div>';
}

async function loadReview() {
  const rows = (await api('/admin/cleanups?verdict=review')).filter(c => !c.reviewed_at);
  document.getElementById('review-count').textContent = toKu(rows.length);
  document.getElementById('review').innerHTML = rows.length
    ? `<div class="cards">${rows.map(c => cleanupCard(c, true)).join('')}</div>`
    : '<div class="empty">هیچ شتێک چاوەڕوانی پشکنین نییە</div>';
}

document.getElementById('review').addEventListener('click', async e => {
  const btn = e.target.closest('[data-review]');
  if (!btn) return;
  btn.disabled = true;
  await api(`/admin/cleanups/${btn.dataset.review}/review`, { method: 'POST',
    body: JSON.stringify({ decision: btn.dataset.decision }) });
  refresh();
});

// ---- points shop vouchers, so staff can honour and check them
async function loadVouchers() {
  const rows = await api('/admin/redemptions');
  document.getElementById('vouchers').innerHTML = rows.length
    ? `<div class="table-wrap"><table><thead><tr><th>کۆد</th><th>خەڵات</th><th>خاڵ</th><th>هاوڵاتی</th>
        <th>مۆبایل</th><th>کات</th></tr></thead><tbody>` +
      rows.map(r => `<tr><td><span class="voucher">${esc(r.voucher)}</span></td><td>${esc(r.reward_name)}</td>
        <td>${toKu(r.cost)}</td><td>${esc(r.name)}</td><td><span class="voucher">${esc(r.phone)}</span></td>
        <td><span class="voucher">${esc(new Date(r.created_at).toLocaleString('en-GB'))}</span></td></tr>`).join('') +
      '</tbody></table></div>'
    : '<div class="empty">هێشتا کەس خەڵاتی وەرنەگرتووە</div>';
}

// ---- league: neighbourhoods by points (the app's /leaderboard rule), spots counted inside each boundary
const rankOf = (rows, i) => 1 + rows.filter(r => r.points > rows[i].points).length;   // equal points, equal rank

function renderLeague(hoods) {
  const box = document.getElementById('league-hoods');
  if (!hoods.length) { box.innerHTML = '<div class="empty">هیچ گەڕەکێک تۆمار نەکراوە</div>'; return; }
  const top = Math.max(0, ...hoods.map(h => h.points));
  // without a boundary the spot counts are unknown, not zero
  const count = (h, n) => h.boundary ? toKu(n) : '<span class="muted" title="سنووری ئەم گەڕەکە بارنەکراوە">—</span>';
  box.innerHTML = `<div class="table-wrap"><table><thead><tr><th>ڕیز</th><th>گەڕەک</th><th>خاڵ</th><th>هاوڵاتی</th>
    <th>شوێنی کراوە</th><th>پاککراوە</th></tr></thead><tbody>` +
    hoods.map((h, i) => {
      const rank = rankOf(hoods, i);
      return `<tr><td><span class="rank ${rank === 1 && h.points > 0 ? 'first' : ''}">${toKu(rank)}</span></td>
        <td>${esc(h.name)}</td>
        <td class="pts-cell"><strong>${toKu(h.points)}</strong>${h.points > 0
          ? `<div class="bar" style="width:${(100 * h.points / top).toFixed(1)}%"></div>` : ''}</td>
        <td>${toKu(h.citizens)}</td><td>${count(h, h.open)}</td><td>${count(h, h.cleaned)}</td></tr>`;
    }).join('') +
    '</tbody></table></div>' +
    (hoods.some(h => !h.boundary)
      ? '<p class="note">شوێنەکان بەپێی سنووری گەڕەک دەژمێردرێن؛ «—» واتە سنووری ئەو گەڕەکە هێشتا بارنەکراوە.</p>' : '');
}

async function loadHoods() {
  const hoods = await api('/admin/neighbourhoods');
  drawAreas(hoods);
  renderLeague(hoods);
}

async function loadPeople() {
  const people = (await api('/leaderboard')).citizens.filter(p => p.points > 0);
  document.getElementById('league-people').innerHTML = people.length
    ? '<ol class="people">' + people.map((p, i) => {
        const rank = rankOf(people, i);
        return `<li><span class="rank ${rank === 1 ? 'first' : ''}">${toKu(rank)}</span>
          <span class="who">${esc(p.name)}${p.neighbourhood ? `<small>${esc(p.neighbourhood)}</small>` : ''}</span>
          <span class="pts">${toKu(p.points)} خاڵ</span></li>`;
      }).join('') + '</ol>'
    : '<div class="empty">هێشتا هیچ هاوڵاتییەک خاڵی وەرنەگرتووە</div>';
}

// ---- totals
async function loadStats() {
  const s = await api('/admin/stats');
  const tiles = [['reported', 'شوێنی ڕاپۆرتکراو'], ['open', 'کراوە'], ['cleaned', 'پاککراوە'],
                 ['litter_removed', 'پاشماوەی لابراو'], ['needs_review', 'چاوەڕوانی پشکنین'], ['citizens', 'هاوڵاتی']];
  document.getElementById('stats').innerHTML = tiles.map(([k, label]) =>
    `<div class="stat"><div class="num">${toKu(s[k])}</div><div class="label">${label}</div></div>`).join('');
}

async function refresh() {
  if (!token) { showLogin(); return; }
  try {
    await Promise.all([loadStats(), loadMap(), loadHoods(), loadPeople(), loadPriority(), loadLog(),
                       loadReview(), loadVouchers()]);
    fitOnce();
  }
  catch (e) { /* the login form opens on auth errors */ }
}

refresh();
setInterval(refresh, 10000);
</script>
</body>
