<!doctype html>
<html lang="ckb" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>داشبۆردی شارەوانی · GreenLegacy سلێمانی</title>
<link rel="preload" href="/static/fonts/arkan.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="/static/leaflet/leaflet.css">
<link rel="stylesheet" href="/static/dashboard/dashboard.css?v=arkan">
<script>
  // the theme before the first paint, so a dark dashboard never flashes white
  (function () {
    var pref = 'system';
    try { pref = localStorage.getItem('gl_theme') || 'system'; } catch (e) { /* storage blocked */ }
    var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  })();
</script>
</head>
<body>
<!-- icons: drawn here so the dashboard needs no icon font from the internet -->

  <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3"/><path d="M21 9h-6a3 3 0 0 0 0 6h6z"/></symbol>

  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 7h3l2-3h6l2 3h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="4"/></symbol>

  <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 20v-1.5a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0 4 18.5V20"/><circle cx="10" cy="8" r="3.5"/><path d="M20 20v-1.5a3.5 3.5 0 0 0-2.5-3.4M15.5 4.6a3.5 3.5 0 0 1 0 6.8"/></symbol>

<!-- ============================================================ sign in -->
<div class="login" id="login" hidden>
  <form class="login-card" id="login-form">
    <div class="brand"><span class="brand-mark"><svg class="icon"><use href="#i-leaf"/></svg></span>
      <span><strong data-t="appTitle"></strong><small data-t="appSub"></small></span></div>
    <div><h1 data-t="loginTitle"></h1><p class="muted small" data-t="loginHint"></p></div>
    <label class="field"><span data-t="loginField"></span>
      <input class="input" name="login" autocomplete="username" dir="ltr" required></label>
    <label class="field"><span data-t="password"></span>
      <input class="input" name="password" type="password" autocomplete="current-password" dir="ltr" required></label>
    <div class="login-error" id="login-error" role="alert"></div>
    <button class="btn btn-primary btn-block" type="submit" data-t="signIn"></button>
  </form>
</div>

<!-- ============================================================ the app -->
<div class="app" id="app" hidden>
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="brand-mark"><svg class="icon"><use href="#i-leaf"/></svg></span>
      <span><strong data-t="appTitle"></strong><small data-t="appSub"></small></span></div>
    <nav class="nav" aria-label="بەشەکان">
      <div class="nav-group"><div class="nav-label" data-t="groups.general"></div>
        <a class="nav-item" href="#overview" data-tab="overview"><svg class="icon"><use href="#i-grid"/></svg><span class="nav-text" data-t="views.overview.0"></span></a>
        <a class="nav-item" href="#map" data-tab="map"><svg class="icon"><use href="#i-map"/></svg><span class="nav-text" data-t="views.map.0"></span></a>
      </div>
      <div class="nav-group"><div class="nav-label" data-t="groups.work"></div>
        <a class="nav-item" href="#priority" data-tab="priority"><svg class="icon"><use href="#i-list"/></svg><span class="nav-text" data-t="views.priority.0"></span></a>
        <a class="nav-item" href="#review" data-tab="review"><svg class="icon"><use href="#i-eye"/></svg><span class="nav-text" data-t="views.review.0"></span><span class="nav-badge" id="review-count"></span></a>
        <a class="nav-item" href="#log" data-tab="log"><svg class="icon"><use href="#i-history"/></svg><span class="nav-text" data-t="views.log.0"></span></a>
      </div>
      <div class="nav-group"><div class="nav-label" data-t="groups.city"></div>
        <a class="nav-item" href="#pins" data-tab="pins"><svg class="icon"><use href="#i-pin"/></svg><span class="nav-text" data-t="views.pins.0"></span></a>
        <a class="nav-item" href="#bins" data-tab="bins"><svg class="icon"><use href="#i-bin"/></svg><span class="nav-text" data-t="views.bins.0"></span><span class="nav-badge" id="bin-count"></span></a>
      </div>
      <div class="nav-group"><div class="nav-label" data-t="groups.places"></div>
        <a class="nav-item" href="#places" data-tab="places"><svg class="icon"><use href="#i-home"/></svg><span class="nav-text" data-t="views.places.0"></span><span class="nav-badge" id="places-count"></span></a>
        <a class="nav-item" href="#money" data-tab="money"><svg class="icon"><use href="#i-wallet"/></svg><span class="nav-text" data-t="views.money.0"></span></a>
      </div>
      <div class="nav-group"><div class="nav-label" data-t="groups.people"></div>
        <a class="nav-item" href="#vouchers" data-tab="vouchers"><svg class="icon"><use href="#i-gift"/></svg><span class="nav-text" data-t="views.vouchers.0"></span><span class="nav-badge" id="voucher-count"></span></a>
        <a class="nav-item" href="#league" data-tab="league"><svg class="icon"><use href="#i-trophy"/></svg><span class="nav-text" data-t="views.league.0"></span></a>
      </div>
    </nav>
    <div class="sidebar-foot">
      <div class="who"><span class="avatar" id="who-initial">ش</span>
        <span><strong id="who-name"></strong><small id="who-phone" class="ltr"></small></span></div>
      <button class="btn btn-ghost btn-sm" id="logout" type="button"><svg class="icon sm"><use href="#i-logout"/></svg><span data-t="signOut"></span></button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header class="topbar">
      <button class="btn btn-ghost btn-icon menu-btn" id="menu-btn" type="button" data-t-aria="menu"><svg class="icon"><use href="#i-menu"/></svg></button>
      <div><h1 id="page-title"></h1><div class="sub" id="page-sub"></div></div>
      <div class="spacer"></div>
      <span class="live" id="live" role="status"><span class="dot"></span><span class="when" id="live-text"></span></span>
      <button class="btn btn-ghost btn-icon" id="refresh-btn" type="button" data-t-aria="refresh"><svg class="icon"><use href="#i-refresh"/></svg></button>
      <button class="btn btn-ghost btn-icon" id="theme-btn" type="button" data-t-aria="theme"><svg class="icon"><use href="#i-monitor"/></svg></button>
    </header>

    <main class="content" id="content">
      <!-- overview -->
      <section class="view" data-view="overview" hidden>
        <div class="kpis" id="ov-kpis"></div>
        <div class="grid-2 lead">
          <div class="card"><div class="card-head"><h3 data-t="attention"></h3></div><div style="padding-top:8px" id="ov-attention"></div></div>
          <div class="card"><div class="card-head"><h3 data-t="dirtiest"></h3><a class="btn btn-ghost btn-sm" href="#priority" data-t="seeAll"></a></div>
            <div class="card-body" id="ov-dirtiest"></div></div>
        </div>
        <div class="grid-2">
          <div class="card"><div class="card-head"><h3 data-t="recentCleanups"></h3><a class="btn btn-ghost btn-sm" href="#log" data-t="seeAll"></a></div>
            <div style="padding-top:8px" id="ov-recent"></div></div>
          <div class="card"><div class="card-head"><h3 data-t="topHoods"></h3><a class="btn btn-ghost btn-sm" href="#league" data-t="seeAll"></a></div>
            <div style="padding-top:8px" id="ov-hoods"></div></div>
        </div>
      </section>

      <!-- live map -->
      <section class="view" data-view="map" hidden>
        <div class="map-shell">
          <div id="map"></div>
          <div class="map-float top">
            <div class="chips" id="map-filters"></div>
            <div class="actions">
              <button class="btn btn-secondary" type="button" data-action="place-bin"><svg class="icon sm"><use href="#i-bin"/></svg><span data-t="addBin"></span></button>
              <button class="btn btn-primary" type="button" data-action="new-pin"><svg class="icon sm"><use href="#i-plus"/></svg><span data-t="addPin"></span></button>
            </div>
          </div>
          <div class="placement" id="placement" hidden><svg class="icon sm"><use href="#i-pin"/></svg><span id="placement-text"></span>
            <button class="btn btn-secondary btn-sm" type="button" data-action="cancel-placing" data-t="cancel"></button></div>
          <div class="legend" id="map-legend"></div>
        </div>
      </section>

      <section class="view" data-view="priority" hidden><div id="priority-list"></div></section>
      <section class="view" data-view="review" hidden><div id="review-list"></div></section>
      <section class="view" data-view="log" hidden><div class="chips" id="log-filters"></div><div id="log-list"></div></section>

      <section class="view" data-view="pins" hidden>
        <div class="toolbar"><div class="grow"></div>
          <button class="btn btn-primary" type="button" data-action="new-pin"><svg class="icon sm"><use href="#i-plus"/></svg><span data-t="addPin"></span></button></div>
        <div id="pins-list"></div>
      </section>

      <section class="view" data-view="bins" hidden>
        <div class="kpis" id="bin-kpis"></div>
        <div class="toolbar"><div class="chips grow" id="bin-filters"></div>
          <button class="btn btn-primary" type="button" data-action="new-bin"><svg class="icon sm"><use href="#i-plus"/></svg><span data-t="addBin"></span></button></div>
        <div id="bins-list"></div>
      </section>

      <section class="view" data-view="places" hidden>
        <div class="toolbar"><div class="chips" id="place-filters"></div></div>
        <div class="note"><svg class="icon sm"><use href="#i-info"/></svg><span data-t="homesPrivate"></span></div>
        <div id="places-list"></div>
      </section>

      <section class="view" data-view="money" hidden>
        <div class="card card-pad">
          <div class="toolbar">
            <label class="field"><span data-t="month"></span><input class="input num" type="month" id="money-month"></label>
            <label class="field"><span data-t="homeAmount"></span><input class="input num" type="number" min="1" step="1000" id="money-household"></label>
            <label class="field"><span data-t="businessAmount"></span><input class="input num" type="number" min="1" step="1000" id="money-business"></label>
            <div class="grow"></div>
            <button class="btn btn-primary" type="button" data-action="credit-all" style="align-self:flex-end"><svg class="icon sm"><use href="#i-wallet"/></svg><span data-t="creditAll"></span></button>
          </div>
        </div>
        <div id="money-list"></div>
      </section>

      <section class="view" data-view="vouchers" hidden>
        <div class="toolbar"><div class="search grow"><svg class="icon sm"><use href="#i-search"/></svg>
          <input class="input" id="voucher-search" type="search" data-t-placeholder="voucherSearch"></div></div>
        <div id="vouchers-list"></div>
      </section>

      <section class="view" data-view="league" hidden>
        <div class="grid-2">
          <div class="card"><div class="card-head"><h3 data-t="hoodsLeague"></h3></div><div class="card-body" id="league-hoods"></div></div>
          <div class="card"><div class="card-head"><h3 data-t="topCitizens"></h3></div><div style="padding-top:8px" id="league-people"></div></div>
        </div>
      </section>
    </main>
  </div>
</div>

<!-- ============================================================ dialogs -->
<dialog class="modal" id="pin-dialog" aria-labelledby="pin-dialog-title">
  <form>
    <div class="modal-head"><div><h3 id="pin-dialog-title" data-t="newPin"></h3><p data-t="newPinSub"></p></div>
      <button class="btn btn-ghost btn-icon btn-sm" type="button" data-close data-t-aria="close"><svg class="icon"><use href="#i-x"/></svg></button></div>
    <div class="modal-body form-grid">
      <div class="field"><span data-t="pinType"></span>
        <div class="choices">
          <label class="choice"><input type="radio" name="category" value="tree_planting" checked><div><span class="emoji">🌱</span><strong data-t="pinTypes.tree_planting.0"></strong><small data-t="pinTypes.tree_planting.2"></small></div></label>
          <label class="choice"><input type="radio" name="category" value="cleanup_target"><div><span class="emoji">⚠️</span><strong data-t="pinTypes.cleanup_target.0"></strong><small data-t="pinTypes.cleanup_target.2"></small></div></label>
          <label class="choice"><input type="radio" name="category" value="watering_point"><div><span class="emoji">💧</span><strong data-t="pinTypes.watering_point.0"></strong><small data-t="pinTypes.watering_point.2"></small></div></label>
        </div></div>
      <label class="field"><span data-t="pinTitle"></span><input class="input" name="title" required maxlength="160" data-t-placeholder="pinTitleHint"></label>
      <label class="field"><span data-t="pinDesc"></span><textarea class="textarea" name="description" required maxlength="1000" data-t-placeholder="pinDescHint"></textarea></label>
      <div class="form-row">
        <label class="field"><span data-t="coords"></span><input class="input num" name="coords" readonly></label>
        <label class="field"><span data-t="target"></span><input class="input num" name="target" type="number" min="1" value="20"></label>
        <label class="field"><span data-t="reward"></span><input class="input num" name="reward" type="number" min="5" step="5" value="50"></label>
      </div>
      <input type="hidden" name="lat"><input type="hidden" name="lon">
      <label class="check"><input type="checkbox" name="notify" checked><span data-t="notify"></span></label>
    </div>
    <div class="modal-foot"><button class="btn btn-secondary" type="button" data-close data-t="cancel"></button>
      <button class="btn btn-primary" type="submit" data-t="publish"></button></div>
  </form>
</dialog>

<dialog class="modal" id="bin-dialog" aria-labelledby="bin-dialog-title">
  <form>
    <div class="modal-head"><div><h3 id="bin-dialog-title" data-t="newBin"></h3><p data-t="newBinSub"></p></div>
      <button class="btn btn-ghost btn-icon btn-sm" type="button" data-close data-t-aria="close"><svg class="icon"><use href="#i-x"/></svg></button></div>
    <div class="modal-body form-grid">
      <label class="field"><span data-t="binName"></span><input class="input" name="name" required maxlength="120" data-t-placeholder="binNameHint"></label>
      <div class="form-row">
        <label class="field"><span data-t="binType"></span><select class="select" name="bin_type">
          <option value="general" data-t="binTypes.general.0"></option><option value="recycle" data-t="binTypes.recycle.0"></option>
          <option value="organic" data-t="binTypes.organic.0"></option><option value="glass_metal" data-t="binTypes.glass_metal.0"></option></select></label>
        <label class="field"><span data-t="capacity"></span><select class="select" name="capacity">
          <option value="240">٢٤٠</option><option value="660">٦٦٠</option><option value="1100">١١٠٠</option></select></label>
      </div>
      <div class="form-row">
        <label class="field"><span data-t="coords"></span><input class="input num" name="coords" readonly></label>
        <div class="field"><span>&nbsp;</span><button class="btn btn-secondary" type="button" data-pick><svg class="icon sm"><use href="#i-pin"/></svg><span data-t="pickOnMap"></span></button></div>
      </div>
      <label class="field"><span data-t="customCode"></span><input class="input num" name="code" maxlength="40" data-t-placeholder="customCodeHint" style="text-transform:uppercase"></label>
      <input type="hidden" name="lat"><input type="hidden" name="lon">
    </div>
    <div class="modal-foot"><button class="btn btn-secondary" type="button" data-close data-t="cancel"></button>
      <button class="btn btn-primary" type="submit" data-t="saveQr"></button></div>
  </form>
</dialog>

<dialog class="modal" id="qr-dialog" aria-labelledby="qr-title">
  <div class="modal-head"><div><h3 id="qr-title"></h3><p data-t="qr"></p></div>
    <button class="btn btn-ghost btn-icon btn-sm" type="button" data-close data-t-aria="close"><svg class="icon"><use href="#i-x"/></svg></button></div>
  <div class="modal-body qr-view">
    <img id="qr-img" alt="QR">
    <span class="code" id="qr-code" style="font-size:18px"></span>
    <p class="muted small" id="qr-desc"></p>
    <p class="note green"><svg class="icon sm"><use href="#i-info"/></svg><span data-t="qrPrintHint"></span></p>
  </div>
  <div class="modal-foot"><button class="btn btn-secondary" type="button" data-close data-t="close"></button>
    <button class="btn btn-secondary" type="button" data-action="qr-print"><svg class="icon sm"><use href="#i-printer"/></svg><span data-t="print"></span></button>
    <button class="btn btn-primary" type="button" data-action="qr-sticker"><svg class="icon sm"><use href="#i-download"/></svg><span data-t="stickerDownload"></span></button></div>
</dialog>

<dialog class="modal wide" id="participants-dialog" aria-labelledby="pm-title">
  <div class="modal-head"><div><h3 id="pm-title"></h3><p id="pm-sub"></p></div>
    <button class="btn btn-ghost btn-icon btn-sm" type="button" data-close data-t-aria="close"><svg class="icon"><use href="#i-x"/></svg></button></div>
  <div class="modal-body" id="pm-body"></div>
  <div class="modal-foot"><button class="btn btn-secondary" type="button" data-close data-t="close"></button></div>
</dialog>

<dialog class="modal" id="confirm-dialog" aria-labelledby="confirm-title">
  <form method="dialog">
    <div class="modal-head"><h3 id="confirm-title"></h3></div>
    <div class="modal-body"><p id="confirm-message"></p></div>
    <div class="modal-foot"><button class="btn btn-secondary" value="cancel" data-t="cancel"></button><button id="confirm-ok" value="ok"></button></div>
  </form>
</dialog>

<dialog class="modal wide lightbox" id="image-dialog">
  <div class="modal-head"><p id="image-dialog-caption"></p>
    <button class="btn btn-ghost btn-icon btn-sm" type="button" data-close data-t-aria="close"><svg class="icon"><use href="#i-x"/></svg></button></div>
  <div class="modal-body"><img id="image-dialog-img" alt=""></div>
</dialog>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="/static/leaflet/leaflet.js"></script>
<script type="module" src="/static/dashboard/app.js"></script>
</body>
</html>
